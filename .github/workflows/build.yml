name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q kaiju-war.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
        working-directory: kaiju-war
      - uses: actions/upload-artifact@v4
        with:
          name: kaiju-war-jar
          path: kaiju-war/build/libs/*.jar
